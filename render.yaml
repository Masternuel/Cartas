services:
  - type: web
    name: carta-viva
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: carta-viva-data
      mountPath: /opt/render/project/src/data
      sizeGB: 5
